# C1-only JIT: the C2 register allocator in OpenJDK 17.0.20 crashes while
# compiling R8 on some low-end hosts (SIGSEGV in PhaseChaitin::Split).
org.gradle.jvmargs=-Xmx2560m -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1536m -XX:TieredStopAtLevel=1

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Vulkan offload is experimental on this project. Enable with:
#   ./gradlew assembleProotDebug -PllamaVulkan=true
# Requires the NDK toolchain to provide glslc (usually NOT the case), so you must
# add the Vulkan SDK / shaderc to the build first. Left off by default on purpose.
llamaVulkan=false

# CPU tuning is portable by default. Most phones from ~2019 have ARMv8.2 dotprod,
# which roughly doubles prompt-processing speed for 4-bit quants. It is NOT the
# default because ARMv8.0 devices would crash with SIGILL. Build per device class:
#   ./gradlew assembleProotDebug -PllamaArmArch=armv8.2-a+dotprod
# You can also add +i8mm (ARMv8.6) for newer big cores; test on the target first.
# llamaArmArch=armv8.2-a+dotprod
